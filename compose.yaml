services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar_dev_only}
      POSTGRES_DB: radar
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://radar:${POSTGRES_PASSWORD:-radar_dev_only}@db:5432/radar
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      BINANCE_API_HOST: ${BINANCE_API_HOST:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_API_HOST: ${OPENAI_API_HOST:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8180:8080"
  web:
    build: .
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - api
volumes:
  postgres_data:
